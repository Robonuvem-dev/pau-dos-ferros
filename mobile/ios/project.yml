name: AuroraDasVeredas
options:
  bundleIdPrefix: org.robonuvem
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  AuroraDasVeredas:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources, Resources]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 3
        PRODUCT_BUNDLE_IDENTIFIER: org.robonuvem.auroradasveredas
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Aurora das Veredas
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Selecionar fotos para publicações do município.
        INFOPLIST_KEY_NSCameraUsageDescription: Registrar fotos autorizadas para publicações do município.
