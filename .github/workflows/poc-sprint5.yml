name: PoC Sprint 5 - qualidade
on:
  push:
    branches: [Vette]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependencias (lockfile)
        run: bun install --frozen-lockfile
      - name: Testes unitarios
        run: bun run test
      - name: Verificacao TypeScript
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        if: always() && steps.checkout.outcome != 'failure'
        run: bun run build
