name: PoC Sprint 5 - qualidade
on:
  push:
    branches: [Vette]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependencias (lockfile)
        run: bun install --frozen-lockfile
      - name: Testes unitarios
        run: bun run test
      - name: Verificacao TypeScript
        run: bunx tsc --noEmit
      - name: Lint (regras de codigo; legado Prettier separado)
        run: |
          bunx eslint . --rule "prettier/prettier: off"
      - name: Auditoria de formato legado (nao bloqueante)
        continue-on-error: true
        run: bunx prettier --check "src/**/*.{ts,tsx}"
      - name: Build
        if: always() && steps.checkout.outcome != 'failure'
        run: bun run build

  sql-sprint5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: poc_disposable_only
          POSTGRES_DB: poc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: poc_disposable_only
      PGDATABASE: poc_test
    steps:
      - uses: actions/checkout@v4
      - name: Preparar contratos minimos Supabase no PostgreSQL descartavel
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/sprint5_fixture.sql
      - name: Aplicar migrations reais em ordem, sem conexao externa
        shell: bash
        run: |
          set -euo pipefail
          for migration in drizzle/migrations/*.sql; do
            echo "Validando $migration"
            psql -X -v ON_ERROR_STOP=1 --single-transaction -f "$migration"
          done
      - name: Testar RLS, RPCs, constraints e auditoria
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/sprint5_assertions.sql

      - name: Testar importacao atomica e classificacao fiscal
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/sprint6_assertions.sql

      - name: Testar obras conselhos frota e emergencia
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/sprint8_assertions.sql

      - name: Testar carga sintetica cadastral
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/carga_sintetica_assertions.sql

      - name: Testar municipio e evidencias ATRICON
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/sprint9_assertions.sql

  ai-local:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar runtime gratuito isolado
        run: npm install --prefix .poc-ai-runtime --no-save @huggingface/transformers@4.3.1
      - name: Executar inferencia real em CPU sem API paga
        run: |
          cp scripts/verify-local-ai.mjs .poc-ai-runtime/check.mjs
          cd .poc-ai-runtime
          node check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: evidencia-ia-local
          path: .poc-ai-runtime/local-ai-evidence.json
