name: PoC Mobile - compilacao e abertura
on:
  push:
    branches: [Vette]
    paths: ['mobile/**','scripts/mobile-*-smoke.py','.github/workflows/poc-mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: SDK e build real do APK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle -p mobile/android :app:assembleDebug :app:lintDebug
      - name: Liberar NDK nao utilizado no runner descartavel
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ] && [ "$ANDROID_HOME" = "/usr/local/lib/android/sdk" ]; then
            sudo rm -rf -- /usr/local/lib/android/sdk/ndk
          fi
          df -h "$ANDROID_HOME"
      - name: Habilitar emulador no runner descartavel
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -dns-server 8.8.8.8,1.1.1.1
          script: |
            adb install mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n org.robonuvem.paudosferrospoc/.MainActivity
            python3 scripts/mobile-android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-poc-apk-e-prova
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/reports/lint-results-debug.html
            mobile/proof/
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Gerar projeto Xcode
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd mobile/ios
          xcodegen generate
      - name: Compilar para simulador iOS
        run: xcodebuild -project mobile/ios/PauDosFerrosPoC.xcodeproj -scheme PauDosFerrosPoC -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath mobile/ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Instalar e abrir no simulador
        run: python3 scripts/mobile-ios-smoke.py
      - name: Compilar para dispositivo sem assinatura
        run: xcodebuild -project mobile/ios/PauDosFerrosPoC.xcodeproj -scheme PauDosFerrosPoC -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath mobile/ios/device-build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-poc-builds-e-prova
          path: |
            mobile/ios/build/Build/Products/Debug-iphonesimulator/PauDosFerrosPoC.app
            mobile/ios/device-build/Build/Products/Debug-iphoneos/PauDosFerrosPoC.app
            mobile/proof/
